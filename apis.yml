aid: gaia
name: Gaia
description: 'Gaia (Gaia Family) is a value-based family-building company that makes fertility
  treatment financially accessible. Founded by Nader AlSalim after his own multi-year IVF
  journey, Gaia replaces unpredictable cycle-by-cycle IVF billing with fixed-price, all-inclusive
  plans and monthly payments, backed by a protection model that offers more tries — or money
  back — if treatment does not succeed. It partners with 180+ fertility clinics across the US
  and UK, covering IVF, egg freezing, embryo transfer, hormone and lab testing, and fertility
  navigation, and also offers fertility benefits to employers. This profile is a company lead
  (no public API surface) maintained in the API Evangelist network.'
